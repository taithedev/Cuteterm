name: CuteTerm CLI smoke tests
on:
  push:
    paths:
      - 'cli/**'
      - 'install.ps1'
      - 'uninstall.ps1'
      - '.github/workflows/cli-smoke.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'install.ps1'
      - 'uninstall.ps1'
      - '.github/workflows/cli-smoke.yml'

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts and run command tests
        shell: pwsh
        run: ./cli/tests/Smoke.ps1
      - name: Test CLI user-level installer
        shell: pwsh
        run: ./install.ps1 -SkipTerminalProfile
      - name: Test one-shot command runner
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA/CuteTerm/cli.ps1" count
          & "$env:LOCALAPPDATA/CuteTerm/cli.ps1" commands
