name: CuteTerm ConPTY Windows release

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'commands/**'
      - 'terminal/**'
      - 'installer/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cuteterm-rust-windows-release
  cancel-in-progress: false

jobs:
  rust-windows:
    if: github.repository == 'taithedev/Cuteterm'
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Test real Rust app and updater
        shell: pwsh
        run: cargo test --all-targets

      - name: Compile Rust release binaries
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Copy x64 builds into installer input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/cuteterm.exe target/release/cuteterm.exe -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/cuteterm-updater.exe target/release/cuteterm-updater.exe -Force

      - name: Test native CLI without a terminal interface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./target/release/cuteterm.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust version check failed' }
          & ./target/release/cuteterm.exe commands
          if ($LASTEXITCODE -ne 0) { throw 'Rust commands check failed' }
          & ./target/release/cuteterm.exe --themes
          if ($LASTEXITCODE -ne 0) { throw 'Rust themes check failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows setup executable
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler not installed' }
          & $compiler installer/CuteTerm.iss
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile Inno Setup' }

      - name: Package Windows installer and verified updater ZIP
        shell: pwsh
        run: python installer/package.py

      - name: Validate installer and update ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipFile = 'dist/CuteTerm-Windows-x64.zip'
          $sha = (Get-FileHash -LiteralPath $zipFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = (Get-Content -LiteralPath "$zipFile.sha256" -Raw).Trim()
          if (-not $line.StartsWith($sha)) { throw 'ZIP SHA-256 verification failed' }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipFile).Path)
          try {
            if ('cuteterm.exe' -notin @($archive.Entries | ForEach-Object FullName)) {
              throw 'Updater ZIP missing cuteterm.exe'
            }
          } finally { $archive.Dispose() }
          $installer = 'dist/CuteTerm-Windows-Setup-0.6.0.exe'
          $p = Start-Process -FilePath (Resolve-Path $installer).Path -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Windows Setup failed with code $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/CuteTerm/cuteterm.exe'
          if (!(Test-Path -LiteralPath $installed)) { throw 'Rust CuteTerm executable was not installed' }
          & $installed --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Rust executable failed its smoke test' }
          $profile = Join-Path $env:LOCALAPPDATA 'Microsoft/Windows Terminal/Fragments/CuteTerm/CuteTerm.json'
          if (!(Test-Path -LiteralPath $profile)) { throw 'Arctic Windows Terminal fragment was not installed' }

      - name: Upload verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: cuteterm-rust-windows-v0.6.0
          path: |
            dist/CuteTerm-Windows-Setup-0.6.0.exe
            dist/CuteTerm-Windows-Setup-0.6.0.exe.sha256
            dist/CuteTerm-Windows-x64.zip
            dist/CuteTerm-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish stable v0.6.0 GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.6.0'
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The $tag release already exists; not overwriting published files."
            exit 0
          }
          $assets = @(
            'dist/CuteTerm-Windows-Setup-0.6.0.exe',
            'dist/CuteTerm-Windows-Setup-0.6.0.exe.sha256',
            'dist/CuteTerm-Windows-x64.zip',
            'dist/CuteTerm-Windows-x64.zip.sha256'
          )
          & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'CuteTerm v0.6.0 - Rust-native Windows Terminal' --notes-file installer/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
