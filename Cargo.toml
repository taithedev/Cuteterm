[package]
name = "cuteterm"
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
description = "Rust-native Windows terminal with persistent ConPTY sessions"
authors = ["CuteTerm Contributors"]
license = "MIT"
repository = "https://github.com/taithedev/Cuteterm"

[[bin]]
name = "cuteterm"
path = "src/main.rs"

[[bin]]
name = "cuteterm-updater"
path = "src/bin/cuteterm-updater.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
portable-pty = "=0.8.1"
vt100 = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[package.metadata.cuteterm]
platform = "windows-x64"
official_repo = "taithedev/Cuteterm"
